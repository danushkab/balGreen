name: Compile Edge Middleware (ARM64)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y curl build-essential zlib1g-dev unzip

      - name: Setup GraalVM (Java 25)
        run: |
          curl -L -o graalvm.tar.gz https://download.oracle.com/graalvm/25/latest/graalvm-jdk-25_linux-aarch64_bin.tar.gz
          sudo tar -xzf graalvm.tar.gz -C /opt
          GRAAL_PATH=$(ls -d /opt/graalvm-* | head -n 1)
          echo "GRAALVM_HOME=$GRAAL_PATH" >> $GITHUB_ENV
          echo "JAVA_HOME=$GRAAL_PATH" >> $GITHUB_ENV
          echo "$GRAAL_PATH/bin" >> $GITHUB_PATH

      - name: Setup Ballerina
        run: |
          curl -L -o bal.zip https://github.com/ballerina-platform/ballerina-distribution/releases/download/v2201.14.1/ballerina-2201.14.1-swan-lake-linux-arm.zip
          sudo mkdir -p /opt/ballerina
          sudo unzip -q bal.zip -d /opt/ballerina/
          BAL_PATH=$(ls -d /opt/ballerina/* | head -n 1)
          echo "BALLERINA_HOME=$BAL_PATH" >> $GITHUB_ENV
          echo "$BAL_PATH/bin" >> $GITHUB_PATH

      - name: Compile Native Image
        run: bal build --graalvm
        
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: tds-middleware-orange-pi
          path: target/bin/