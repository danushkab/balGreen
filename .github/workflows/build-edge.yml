name: Compile Edge Middleware (ARM64)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Compile Native Image (GraalVM ARM64)
        run: |
          # Use Oracle's official ARM64 GraalVM Ubuntu image and inject Ballerina
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/graalvm/native-image-community:17-ubuntu \
            bash -c "apt-get update && apt-get install -y curl build-essential zlib1g-dev && \
                     curl -L -o bal.deb https://dist.ballerina.io/downloads/2201.8.0/ballerina-2201.8.0-swan-lake-linux-arm64.deb && \
                     dpkg -i bal.deb && \
                     export GRAALVM_HOME=\$JAVA_HOME && \
                     bal build --graalvm"
            
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: tds-middleware-orange-pi
          path: target/bin/