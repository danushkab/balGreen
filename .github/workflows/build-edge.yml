name: Compile Edge Middleware (ARM64)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Compile Native Image (GraalVM ARM64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 \
            bash -c 'apt-get update && apt-get install -y curl build-essential zlib1g-dev unzip && \
                     curl -L -o graalvm.tar.gz https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-17.0.9/graalvm-community-jdk-17.0.9_linux-aarch64_bin.tar.gz && \
                     tar -xzf graalvm.tar.gz -C /opt && \
                     export GRAALVM_HOME=$(ls -d /opt/graalvm-community-openjdk-17*) && \
                     export JAVA_HOME=$GRAALVM_HOME && \
                     export PATH=$JAVA_HOME/bin:$PATH && \
                     curl -L -o bal.zip https://dist.ballerina.io/downloads/2201.14.1/ballerina-2201.14.1-swan-lake.zip && \
                     unzip -q bal.zip -d /opt/ && \
                     export PATH=/opt/ballerina-2201.14.1-swan-lake/bin:$PATH && \
                     bal dist pull 2201.14.1 && \
                     bal dist use 2201.14.1 && \
                     bal build --graalvm'
            
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: tds-middleware-orange-pi
          path: target/bin/